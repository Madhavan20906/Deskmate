<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Deskmate</title>
  </head>
  <body style="margin: 0; background-color: transparent; overflow: hidden">
    <div id="scene-container"></div>
    <div
      id="xr-launcher"
      style="
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        pointer-events: auto;
      "
    >
      <button
        id="dom-xr-btn"
        style="
          background: rgba(17, 26, 34, 0.88);
          backdrop-filter: blur(16px);
          border: 1.5px solid #53cbb5;
          color: #f3f6f7;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 15px;
          font-weight: 700;
          letter-spacing: 0.5px;
          padding: 12px 28px;
          border-radius: 999px;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 10px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        "
      >
        <span style="font-size: 18px">🥽</span>
        <span>Enter XR Workspace</span>
      </button>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
