<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Deskmate</title>
  </head>
  <body style="margin: 0; background-color: transparent; overflow: hidden">
    <div id="scene-container"></div>
    <div
      id="xr-launcher"
      style="
        position: fixed;
        top: 18px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        pointer-events: auto;
      "
    >
      <button
        id="dom-xr-btn"
        style="
          background: rgba(17, 26, 34, 0.92);
          backdrop-filter: blur(16px);
          border: 1.5px solid #53cbb5;
          color: #f3f6f7;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 0.5px;
          padding: 10px 22px;
          border-radius: 999px;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 8px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
          transition: transform 0.15s ease, background 0.15s ease;
        "
      >
        <span style="font-size: 16px">🥽</span>
        <span>Enter XR Workspace</span>
      </button>
      <div
        id="xr-hint"
        style="
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 11px;
          font-weight: 500;
          color: #8da4b8;
          text-align: right;
          margin-top: 6px;
          text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
          letter-spacing: 0.3px;
          max-width: 280px;
        "
      >
        3D Study Room • Right-drag to look around
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
