<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f141c" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>deskmate</title>
    <style>
      html,
      body,
      #scene-container {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background-color: #0f141c;
      }

      #scene-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }

      .xr-overlay {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 8px 6px 14px;
        border-radius: 9999px;
        background: rgba(18, 24, 38, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e2e8f0;
        opacity: 0.88;
        transition: opacity 0.25s ease, transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
        pointer-events: auto;
      }

      .xr-overlay:hover {
        opacity: 1;
        background: rgba(22, 30, 46, 0.85);
        border-color: rgba(83, 203, 181, 0.35);
      }

      .xr-overlay.xr-session-active {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(16px);
      }

      .xr-badge-group {
        display: flex;
        align-items: center;
        gap: 8px;
        user-select: none;
      }

      .xr-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #8ce2d2;
        box-shadow: 0 0 8px rgba(140, 226, 210, 0.6);
      }

      .xr-badge {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.3px;
        color: rgba(226, 232, 240, 0.8);
      }

      .xr-launch-button {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(0, 130, 251, 0.85);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      }

      .xr-launch-button:hover {
        background: #0082fb;
        box-shadow: 0 2px 14px rgba(0, 130, 251, 0.45);
        transform: translateY(-1px);
      }

      .xr-launch-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div class="xr-overlay">
      <div class="xr-badge-group">
        <span class="xr-dot"></span>
        <span class="xr-badge">Deskmate MR</span>
      </div>
      <button id="xr-overlay-launch-btn" class="xr-launch-button" onclick="window.__launchXR ? window.__launchXR() : null">
        🥽 Enter XR
      </button>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
